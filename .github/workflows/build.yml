name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            packaging/requirements.txt
            packaging/requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r packaging/requirements.txt -r packaging/requirements-build.txt

      - name: Run tests
        run: python -X utf8 -m unittest discover -s tests -v

      - name: Build (folder, used by the installer)
        run: python -X utf8 -m PyInstaller --clean --noconfirm --distpath build/dist --workpath build/work packaging/windows/AeroxLite.spec

      - name: Build (portable single EXE)
        run: python -X utf8 -m PyInstaller --clean --noconfirm --distpath build/portable --workpath build/work-portable packaging/windows/AeroxLite-portable.spec

      - name: Self-test the built EXE
        shell: pwsh
        run: |
          foreach ($exe in "build/dist/AeroxLite/AeroxLite.exe", "build/portable/AeroxLite.exe") {
            $p = Start-Process $exe -ArgumentList "--self-test" -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "self-test failed for $exe ($($p.ExitCode))" }
          }

      - name: Package
        shell: pwsh
        run: |
          # Root: installer, uninstaller, guide. Everything else in app\.
          New-Item -ItemType Directory -Force pkg/AeroxLite/app | Out-Null
          Copy-Item "Install Aerox Lite.bat", "Uninstall Aerox Lite.bat", HOW-TO-INSTALL.txt pkg/AeroxLite/
          Copy-Item build/dist/AeroxLite pkg/AeroxLite/app/ -Recurse
          Copy-Item packaging/windows/install.ps1, packaging/windows/uninstall.ps1, packaging/windows/build.ps1, packaging/windows/AeroxLite.ico, LICENSE pkg/AeroxLite/app/
          Compress-Archive -Path pkg/AeroxLite -DestinationPath AeroxLite-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroxLite-windows
          path: AeroxLite-windows.zip

      - name: Release notes for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python packaging/release_notes.py "${{ github.ref_name }}"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AeroxLite-windows.zip
            build/portable/AeroxLite.exe
          body_path: release-notes.md
