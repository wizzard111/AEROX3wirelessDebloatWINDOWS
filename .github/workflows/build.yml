name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -X utf8 -m unittest discover -s tests -v

      - name: Build EXE
        run: python -X utf8 -m PyInstaller --clean --noconfirm AeroxLite.spec

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/AeroxLite | Out-Null
          Copy-Item dist/AeroxLite.exe, HOW-TO-INSTALL.txt, LICENSE pkg/AeroxLite/
          Compress-Archive -Path pkg/AeroxLite -DestinationPath AeroxLite-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroxLite-windows
          path: AeroxLite-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AeroxLite-windows.zip
            dist/AeroxLite.exe
          body_path: CHANGELOG.md
